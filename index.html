<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>大阪メトロ 駅名ルーレット</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#111318;--muted:#6b7280;--line:#e5e7eb;
  --dark:#111827;--blue:#2563eb;--red:#e53935;--shadow:0 10px 30px rgba(0,0,0,.075);
  --r:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
}
button,select{font:inherit}
.wrap{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;line-height:1.2;margin:3px 2px 16px;letter-spacing:-.025em}
.card{background:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.select-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr) 58px;gap:7px;align-items:center}
select{
  min-width:0;width:100%;border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:14px;padding:13px 12px;font-size:15px;font-weight:750;outline:none
}
.btn{border:0;border-radius:14px;font-weight:850;cursor:pointer;touch-action:manipulation}
.small-btn{padding:10px 6px;background:#eef0f3;color:#111827;white-space:nowrap;font-size:12px;min-height:40px}
.ghost-btn{padding:11px 13px;background:#f3f4f6;color:#111827;font-size:13px}
.main-btn{width:100%;padding:16px;background:#111827;color:white;font-size:17px}
.line-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.line-badge{
  display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;background:#fff;
  border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800
}
.line-dot{width:9px;height:9px;border-radius:50%;flex:none}
.visited-wrap{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:116px;overflow:auto;
  padding-right:2px
}
.chip{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750}
.empty{color:var(--muted);font-size:13px}
.actions{display:flex;gap:9px;margin-top:12px}
.actions .btn{flex:1}

.time-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.time-btn{
  padding:12px 8px;border:1px solid #d9dde4;border-radius:14px;background:#fff;color:#111827;
  font-size:15px;font-weight:900;cursor:pointer
}
.time-btn.active{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.22)}

.slot-shell{
  position:relative;height:96px;overflow:hidden;border-radius:18px;background:#0b0e14;
  border:5px solid #2563eb;box-shadow:0 10px 26px rgba(37,99,235,.20);
  cursor:pointer;touch-action:manipulation;transition:.2s
}
.slot-shell:active{transform:scale(.995)}
.slot-shell.is-disabled{border-color:#9ca3af;box-shadow:none;opacity:.58;cursor:default}
.slot-shell.is-spinning{border-color:#6b7280;box-shadow:none;opacity:.72;cursor:default}
.slot-shell:before,.slot-shell:after{
  content:"";position:absolute;left:0;right:0;height:24px;z-index:4;pointer-events:none
}
.slot-shell:before{top:0;background:linear-gradient(#0b0e14,transparent)}
.slot-shell:after{bottom:0;background:linear-gradient(transparent,#0b0e14)}
.slot-window{
  position:absolute;left:10px;right:10px;top:50%;height:64px;transform:translateY(-50%);
  border-top:1px solid rgba(255,255,255,.17);border-bottom:1px solid rgba(255,255,255,.17);
  z-index:3;pointer-events:none
}
.reel{position:absolute;left:0;right:0;top:16px;will-change:transform}
.reel-item{
  height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;
  color:#fff;font-size:27px;font-weight:950;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.45)
}
.reel-item.long{font-size:20px}
.spin-meta{display:flex;justify-content:space-between;gap:10px;margin:10px 2px 5px;color:var(--muted);font-size:12px}
.candidate-names{
  color:#7b8190;font-size:10.5px;line-height:1.55;margin:0 2px 10px;
  max-height:50px;overflow:auto
}
.progress{height:5px;border-radius:99px;background:#e5e7eb;overflow:hidden}
.progress>div{height:100%;width:0;background:#2563eb}

.result{display:none}
.result.show{display:block}
.result-head{text-align:center;padding:2px 0 7px}
.result-kicker{font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.08em}
.result-furigana{font-size:14px;font-weight:800;color:#6b7280;letter-spacing:.08em;margin-top:7px;min-height:18px}
.result-station{font-size:38px;font-weight:950;letter-spacing:-.035em;margin:4px 0 3px}
.result-lines{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.fare-card{
  margin:12px 0;background:#f8f9fb;border:1px solid var(--line);border-radius:16px;
  padding:13px;text-align:center
}
.fare-card .k{font-size:11px;color:var(--muted);font-weight:800}
.fare-card .v{font-size:23px;font-weight:950;margin-top:3px}
.route-option{
  border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px;background:#fff
}
.route-option-head{padding:13px 14px;border-bottom:1px solid var(--line)}
.route-name-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.route-line-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900}
.route-code{
  width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:950;flex:none
}
.route-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.mini-stat{background:#f7f8fa;border-radius:12px;padding:9px 8px}
.mini-stat .k{font-size:9.5px;color:var(--muted);font-weight:800;margin-bottom:3px}
.mini-stat .v{font-size:14px;font-weight:900;line-height:1.25}
.route-map{padding:13px 14px 14px}
.route-stop{position:relative;display:grid;grid-template-columns:27px 1fr;min-height:39px}
.route-stop:not(:last-child):before{
  content:"";position:absolute;left:12px;top:19px;bottom:-19px;width:4px;background:var(--route-color);border-radius:9px
}
.stop-dot{
  width:14px;height:14px;border:3px solid var(--route-color);background:#fff;border-radius:50%;
  margin:6px 0 0 6px;position:relative;z-index:2
}
.stop-dot.start{background:#111827;border-color:#111827}
.stop-dot.goal{background:#e53935;border-color:#e53935}
.stop-name{font-size:14px;font-weight:800;padding:4px 0 9px}
.stop-name.goal{color:#d92d2a;font-weight:950}
.stop-code{color:var(--muted);font-size:10px;font-weight:700;margin-left:5px}
.note{font-size:10.5px;line-height:1.55;color:var(--muted);margin:11px 2px 0}

@media(max-width:500px){
  .wrap{padding-left:12px;padding-right:12px}
  .card{padding:15px}
  .select-grid{grid-template-columns:minmax(0,.82fr) minmax(0,1.28fr) 52px}
  .select-grid .small-btn{grid-column:auto;padding:9px 4px;font-size:11px}
  .result-station{font-size:34px}
  .route-stats{gap:5px}
  .mini-stat{padding:8px 5px}
  .mini-stat .v{font-size:13px}
}
</style>

<body>
<div class="wrap">
  <h1>大阪メトロ 駅名ルーレット</h1>

  <section class="card">
    <div class="label" id="currentLabel">スタート駅</div>
    <div class="select-grid">
      <select id="lineSelect" aria-label="路線"></select>
      <select id="stationSelect" aria-label="駅"></select>
      <button class="btn small-btn" id="setCurrent">設定</button>
    </div>
    <div id="currentLines" class="line-badges"></div>

    <div class="label" style="margin-top:15px">訪問済み</div>
    <div id="visited" class="visited-wrap"><span class="empty">なし</span></div>
    <div class="actions">
      <button class="btn ghost-btn" id="undoBtn">1つ戻す</button>
      <button class="btn ghost-btn" id="resetBtn">リセット</button>
    </div>
  </section>

  <section class="card">
    <div class="label">移動時間</div>
    <div class="time-tabs">
      <button class="time-btn" data-minutes="10">10分以内</button>
      <button class="time-btn active" data-minutes="15">15分以内</button>
      <button class="time-btn" data-minutes="20">20分以内</button>
    </div>

    <div class="slot-shell is-disabled" id="slotShell" role="button" tabindex="0" aria-label="ルーレットを回す">
      <div class="slot-window"></div>
      <div class="reel" id="reel"><div class="reel-item long">スタート駅を設定してね</div></div>
    </div>
    <div class="spin-meta">
      <span id="candidateCount">候補 —</span>
      <span id="spinStatus">スタート駅未設定</span>
    </div>
    <div id="candidateNames" class="candidate-names"></div>
    <div class="progress"><div id="progressBar"></div></div>
  </section>

  <section class="card result" id="resultCard">
    <div class="result-head">
      <div class="result-kicker">NEXT STATION</div>
      <div class="result-furigana" id="winnerFurigana"></div>
      <div class="result-station" id="winnerName">—</div>
      <div class="result-lines" id="winnerLines"></div>
    </div>

    <div id="routeOptions"></div>

    <div class="actions">
      <button class="btn main-btn" id="arriveBtn">この駅に到着</button>
    </div>
    <div class="note">
      所要時間は駅間ごとの固定目安を合計した値です。実際の列車・待ち時間等で変わります。
      夢洲駅は対象外です。
    </div>
  </section>
</div>

const lineOrder = ["M","T","Y","C","S","K","N","I","P"];
const stateKey = "osaka-metro-roulette-v1";
const itemH = 64;

const lineSelect = document.getElementById("lineSelect");
const stationSelect = document.getElementById("stationSelect");
const currentLabel = document.getElementById("currentLabel");
const currentLinesEl = document.getElementById("currentLines");
const visitedEl = document.getElementById("visited");
const slotShell = document.getElementById("slotShell");
const reel = document.getElementById("reel");
const candidateCount = document.getElementById("candidateCount");
const candidateNames = document.getElementById("candidateNames");
const spinStatus = document.getElementById("spinStatus");
const progressBar = document.getElementById("progressBar");
const resultCard = document.getElementById("resultCard");

let current = null;
let visited = [];
let timeLimit = 15;
let spinning = false;
let pendingWinner = null;
let pendingRoutes = [];

function codeFor(lineId, index){ return LINES[lineId].codes[index]; }
function stationIndex(lineId, station){ return LINES[lineId].stations.indexOf(station); }
function linesForStation(station){
  return lineOrder.filter(id => LINES[id].stations.includes(station));
}
function badgeHTML(lineId){
  const line=LINES[lineId];
  return `<span class="line-badge"><span class="line-dot" style="background:${line.color}"></span>${line.name}</span>`;
}
function persist(){
  localStorage.setItem(stateKey, JSON.stringify({current,visited,timeLimit}));
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(stateKey)||"null");
    if(!s) return;
    if(Array.isArray(s.visited)) visited=s.visited.filter(Boolean);
    if(s.current && visited.includes(s.current)) current=s.current;
    else if(visited.length) current=visited[visited.length-1];
    if([10,15,20].includes(Number(s.timeLimit))) timeLimit=Number(s.timeLimit);
  }catch(e){}
}

// ----- Selectors -----
lineOrder.forEach(id=>{
  const o=document.createElement("option");
  o.value=id; o.textContent=LINES[id].name;
  lineSelect.appendChild(o);
});

function populateStations(preferred=null){
  const id=lineSelect.value;
  stationSelect.innerHTML="";
  LINES[id].stations.forEach((name,i)=>{
    const o=document.createElement("option");
    o.value=name; o.textContent=`${codeFor(id,i)}  ${name}`;
    stationSelect.appendChild(o);
  });
  if(preferred && LINES[id].stations.includes(preferred)) stationSelect.value=preferred;
}
lineSelect.addEventListener("change",()=>populateStations());

function syncSelectors(){
  if(!current){ populateStations(); return; }
  const ids=linesForStation(current);
  if(ids.length){
    lineSelect.value=ids[0];
    populateStations(current);
  }
}

// ----- Fixed direct ride calculations -----
function directRoute(lineId, from, to){
  const line=LINES[lineId];
  const a=stationIndex(lineId,from), b=stationIndex(lineId,to);
  if(a<0 || b<0 || a===b) return null;
  const lo=Math.min(a,b), hi=Math.max(a,b);
  let minutes=0;
  for(let i=lo;i<hi;i++) minutes += line.segmentMinutes[i];
  const stops=Math.abs(b-a);
  const direction=b>a ? line.endDir : line.startDir;
  const path=[];
  const step=b>a ? 1 : -1;
  for(let i=a;;i+=step){
    path.push({name:line.stations[i],code:line.codes[i],index:i});
    if(i===b) break;
  }
  return {lineId,minutes,stops,direction,path,fromIndex:a,toIndex:b};
}

function candidateMap(){
  const map=new Map();
  if(!current) return map;
  const curLines=linesForStation(current);
  curLines.forEach(lineId=>{
    const line=LINES[lineId];
    line.stations.forEach(dest=>{
      if(dest===current || visited.includes(dest)) return;
      const route=directRoute(lineId,current,dest);
      if(route && route.minutes<=timeLimit){
        if(!map.has(dest)) map.set(dest,[]);
        map.get(dest).push(route);
      }
    });
  });
  // Sort each destination's route options by time, then stops.
  for(const [dest,routes] of map){
    routes.sort((a,b)=>a.minutes-b.minutes || a.stops-b.stops || lineOrder.indexOf(a.lineId)-lineOrder.indexOf(b.lineId));
  }
  return map;
}

function renderCurrentLines(){
  if(!current){ currentLinesEl.innerHTML=""; return; }
  currentLinesEl.innerHTML=linesForStation(current).map(badgeHTML).join("");
}

function renderVisited(){
  visitedEl.innerHTML="";
  if(!visited.length) visitedEl.innerHTML='<span class="empty">なし</span>';
  else visited.forEach(n=>{
    const e=document.createElement("span");
    e.className="chip"; e.textContent=n; visitedEl.appendChild(e);
  });
}

function renderTimeTabs(){
  document.querySelectorAll(".time-btn").forEach(btn=>{
    btn.classList.toggle("active",Number(btn.dataset.minutes)===timeLimit);
  });
}

function setPrompt(text,status,disabled=true){
  reel.style.transform="translateY(0)";
  reel.innerHTML=`<div class="reel-item ${text.length>=9?"long":""}">${text}</div>`;
  spinStatus.textContent=status;
  slotShell.classList.toggle("is-disabled",disabled);
  slotShell.setAttribute("aria-disabled",disabled?"true":"false");
}

function renderCandidates(){
  const hasStart=!!current && visited.length>0;
  currentLabel.textContent=hasStart ? "現在地" : "スタート駅";
  renderCurrentLines();
  renderVisited();
  renderTimeTabs();

  if(!hasStart){
    candidateCount.textContent="候補 —";
    candidateNames.textContent="";
    setPrompt("スタート駅を設定してね","スタート駅未設定",true);
    return;
  }

  const map=candidateMap();
  const names=[...map.keys()];
  candidateCount.textContent=`候補 ${names.length}駅`;
  candidateNames.textContent=names.length ? `候補駅：${names.join(" / ")}` : "候補駅：なし";

  if(!spinning && names.length===0){
    setPrompt("候補駅なし","移動時間を広げるか、現在地を変更してね",true);
  }else if(!spinning && !pendingWinner){
    slotShell.classList.remove("is-disabled");
    slotShell.setAttribute("aria-disabled","false");
  }
}

// ----- Set / reset / undo -----
function setCurrent(name){
  current=name;
  const oldIndex=visited.indexOf(name);
  if(oldIndex>=0) visited.splice(oldIndex,1);
  visited.push(name);
  pendingWinner=null; pendingRoutes=[];
  persist();
  syncSelectors();
  resultCard.classList.remove("show");
  progressBar.style.width="0%";
  setPrompt("まわして！","タップして抽選",false);
  renderCandidates();
}

document.getElementById("setCurrent").addEventListener("click",()=>{
  setCurrent(stationSelect.value);
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  current=null; visited=[]; pendingWinner=null; pendingRoutes=[]; spinning=false;
  localStorage.removeItem(stateKey);
  lineSelect.value="M";
  populateStations("梅田");
  resultCard.classList.remove("show");
  progressBar.style.width="0%";
  slotShell.classList.remove("is-spinning");
  renderCandidates();
});

document.getElementById("undoBtn").addEventListener("click",()=>{
  if(!visited.length) return;
  visited.pop();
  pendingWinner=null; pendingRoutes=[];
  resultCard.classList.remove("show");
  progressBar.style.width="0%";
  if(!visited.length){
    current=null;
    persist();
    lineSelect.value="M";
    populateStations();
    renderCandidates();
    return;
  }
  current=visited[visited.length-1];
  persist();
  syncSelectors();
  setPrompt("まわして！","タップして抽選",false);
  renderCandidates();
});

document.querySelectorAll(".time-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(spinning) return;
    timeLimit=Number(btn.dataset.minutes);
    pendingWinner=null; pendingRoutes=[];
    resultCard.classList.remove("show");
    persist();
    if(current) setPrompt("まわして！","タップして抽選",false);
    renderCandidates();
  });
});

// ----- Fare graph -----
// Shortest-distance network for reference fare.
function buildFareGraph(){
  const graph=new Map();
  const add=(a,b,w)=>{
    if(!graph.has(a)) graph.set(a,[]);
    graph.get(a).push([b,w]);
  };
  lineOrder.forEach(id=>{
    const line=LINES[id];
    for(let i=0;i<line.stations.length-1;i++){
      const a=line.stations[i], b=line.stations[i+1];
      const w=Math.round((line.km[i+1]-line.km[i])*10)/10;
      add(a,b,w); add(b,a,w);
    }
  });
  // Official fare-calculation same/transfer-station treatment.
  [["梅田","東梅田"],["梅田","西梅田"],["東梅田","西梅田"],["心斎橋","四ツ橋"]].forEach(([a,b])=>{
    add(a,b,0); add(b,a,0);
  });
  return graph;
}
const fareGraph=buildFareGraph();

function shortestKm(start,goal){
  const dist=new Map([[start,0]]);
  const done=new Set();
  while(true){
    let u=null,best=Infinity;
    for(const [n,d] of dist){
      if(!done.has(n) && d<best){best=d;u=n;}
    }
    if(u===null) return Infinity;
    if(u===goal) return best;
    done.add(u);
    for(const [v,w] of (fareGraph.get(u)||[])){
      const nd=best+w;
      if(nd<(dist.get(v)??Infinity)) dist.set(v,nd);
    }
  }
}
function fareFor(from,to){
  const km=shortestKm(from,to);
  if(km<=3.00001) return {fare:190,km};
  if(km<=7.00001) return {fare:240,km};
  if(km<=13.00001) return {fare:290,km};
  if(km<=19.00001) return {fare:340,km};
  return {fare:390,km};
}

// ----- Roulette -----
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function easeOutQuart(t){ return 1-Math.pow(1-t,4); }
function reelItem(name){
  return `<div class="reel-item ${name.length>=9?"long":""}">${name}</div>`;
}

function startSpin(){
  const map=candidateMap();
  const pool=[...map.keys()];
  if(spinning || !current || !pool.length) return;

  spinning=true;
  pendingWinner=null; pendingRoutes=[];
  resultCard.classList.remove("show");
  slotShell.classList.remove("is-disabled");
  slotShell.classList.add("is-spinning");
  slotShell.setAttribute("aria-disabled","true");
  spinStatus.textContent="回転中…";
  progressBar.style.width="0%";

  const winner=pick(pool);
  const seq=[];
  const totalItems=120;
  for(let i=0;i<totalItems-1;i++) seq.push(pick(pool));
  seq.push(winner);
  reel.innerHTML=seq.map(reelItem).join("");

  const endY=-(totalItems-1)*itemH;
  const duration=10000;
  const start=performance.now();

  function frame(now){
    const raw=Math.min((now-start)/duration,1);
    const eased=easeOutQuart(raw);
    let y=endY*eased;
    if(raw>0.94){
      const q=(raw-0.94)/0.06;
      y += Math.sin(q*Math.PI*2.2)*(1-q)*7;
    }
    reel.style.transform=`translateY(${y}px)`;
    progressBar.style.width=`${raw*100}%`;

    if(raw<1) requestAnimationFrame(frame);
    else{
      reel.style.transform=`translateY(${endY}px)`;
      spinning=false;
      slotShell.classList.remove("is-spinning");
      spinStatus.textContent="決定！";
      progressBar.style.width="100%";
      pendingWinner=winner;
      pendingRoutes=map.get(winner)||[];
      showResult(winner,pendingRoutes);
      renderCandidates();
      setTimeout(()=>resultCard.scrollIntoView({behavior:"smooth",block:"start"}),220);
    }
  }
  requestAnimationFrame(frame);
}
slotShell.addEventListener("click",startSpin);
slotShell.addEventListener("keydown",e=>{
  if(e.key==="Enter" || e.key===" "){e.preventDefault();startSpin();}
});

// ----- Result -----
function routeBadge(lineId){
  const line=LINES[lineId];
  return `<span class="line-badge"><span class="line-dot" style="background:${line.color}"></span>${line.name}</span>`;
}
function routeMapHTML(route){
  const line=LINES[route.lineId];
  return `
    <div class="route-map" style="--route-color:${line.color}">
      ${route.path.map((s,i)=>{
        const isStart=i===0, isGoal=i===route.path.length-1;
        return `<div class="route-stop">
          <span class="stop-dot ${isStart?"start":""} ${isGoal?"goal":""}"></span>
          <div class="stop-name ${isGoal?"goal":""}">${s.name}<span class="stop-code">${s.code}</span></div>
        </div>`;
      }).join("")}
    </div>`;
}
function routeOptionHTML(route){
  const line=LINES[route.lineId];
  return `
    <div class="route-option">
      <div class="route-option-head">
        <div class="route-name-row">
          <div class="route-line-name">
            <span class="route-code" style="background:${line.color}">${route.lineId}</span>
            ${line.name}
          </div>
        </div>
        <div class="route-stats">
          <div class="mini-stat"><div class="k">駅数</div><div class="v">${route.stops}駅先</div></div>
          <div class="mini-stat"><div class="k">乗車時間目安</div><div class="v">約${route.minutes}分</div></div>
          <div class="mini-stat"><div class="k">おすすめ方向</div><div class="v">${route.direction}</div></div>
        </div>
      </div>
      ${routeMapHTML(route)}
    </div>`;
}

function showResult(winner,routes){
  document.getElementById("winnerFurigana").textContent=FURIGANA[winner] || "";
  document.getElementById("winnerName").textContent=winner;
  const uniqueLines=[...new Set(routes.map(r=>r.lineId))];
  document.getElementById("winnerLines").innerHTML=uniqueLines.map(routeBadge).join("");
  document.getElementById("routeOptions").innerHTML=routes.map(routeOptionHTML).join("");
  resultCard.classList.add("show");
}

document.getElementById("arriveBtn").addEventListener("click",()=>{
  if(!pendingWinner) return;
  setCurrent(pendingWinner);
});

// ----- Init -----
load();
renderTimeTabs();
if(current){
  syncSelectors();
  setPrompt("まわして！","タップして抽選",false);
}else{
  lineSelect.value="M";
  populateStations("梅田");
}
renderCandidates();
</script>
